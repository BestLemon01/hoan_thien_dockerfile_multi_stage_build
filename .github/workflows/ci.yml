name: Cart Service Multi-Stage Build
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Multi-stage Image
        run: |
          docker build -t cart-service:multistage .

      - name: Inspect and Compare Image Size
        run: |
          docker images cart-service:multistage
